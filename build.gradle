plugins {
    id "net.fabricmc.fabric-loom" version '1.17-SNAPSHOT'
    id "com.modrinth.minotaur" version "${modrinth_version}"
    id 'maven-publish'
}

version = version = "${project.minecraft_version}+${project.mod_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = rootProject.file("src/main/resources/aries.aw")

    runs {
        client {
            generateRunConfig = true
            runDirectory = file("../../run")

            systemProperties.put("devauth.enabled", "true")
            systemProperties.put("devauth.account", "main")
        }
    }
}

def modVersion = project.version.toString()

def modrinthVersionType =
        modVersion.contains("-alpha") ? "alpha" :
                modVersion.contains("-beta") ? "beta" : "release"

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = archives_base_name.toLowerCase(Locale.ROOT)

    versionNumber = modVersion
    versionType = modrinthVersionType

    uploadFile = tasks.jar

    gameVersions = [minecraft_version]

    dependencies {
        required.project "fabric-api"
        required.project "hypixel-mod-api"
    }
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Additional repositories for external dependencies.
    // See: https://docs.gradle.org/current/userguide/declaring_repositories.html

    // Hypixel Mod API: https://github.com/HypixelDev/ModAPI
    maven {
        url 'https://repo.hypixel.net/repository/Hypixel/'
    }

    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.hypixel:mod-api:${project.hypixel_mod_api_version}"

    implementation "me.djtheredstoner:DevAuth-fabric:${project.dev_auth_version}"
}


processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version
    //noinspection GrUnresolvedAccess
    inputs.property "minecraft_version", project.minecraft_version
    //noinspection GrUnresolvedAccess
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        //noinspection GrUnresolvedAccess
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25 // Minecraft 26.2 requires Java 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named("sourcesJar") {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            //noinspection GroovyAssignabilityCheck
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
