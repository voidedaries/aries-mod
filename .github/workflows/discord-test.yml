name: Test Discord Announcement

on:
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aries repository
        uses: actions/checkout@v4

      - name: Announce release on Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl --fail-with-body \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Aries-GitHub-Actions/1.0" \
            --data-raw '{
              "username": "Aries Bot",
              "content": "## Aries 1.4.2 for 26.1.2 and 26.2\n\n* Test Discord announcement\n\nhttps://modrinth.com/mod/aries"
            }'