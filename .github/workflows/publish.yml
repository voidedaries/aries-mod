name: Build and Publish to Modrinth

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aries repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Aries
        run: ./gradlew buildAll

      - name: Publish to Modrinth
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: ${{secrets.MODRINTH_TOKEN}}

      - name: Announce release on Discord
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          # Read Aries version from the root gradle.properties
          gradle_properties = Path("gradle.properties").read_text(encoding="utf-8")

          mod_version_match = re.search(
              r"^mod_version=(.+)$",
              gradle_properties,
              re.MULTILINE
          )

          if not mod_version_match:
              raise RuntimeError("Could not find mod_version in gradle.properties")

          mod_version = mod_version_match.group(1).strip()

          # Find all Stonecutter Minecraft versions
          versions_dir = Path("versions")

          minecraft_versions = sorted(
              path.name
              for path in versions_dir.iterdir()
              if path.is_dir()
          )

          if not minecraft_versions:
              raise RuntimeError("Could not find any Minecraft versions in versions/")

          version_text = " and ".join(minecraft_versions)

          # Only use the first line of the commit message
          commit_message = os.environ["COMMIT_MESSAGE"].splitlines()[0].strip()

          # Capitalise the first letter for the Discord announcement
          if commit_message:
              commit_message = commit_message[0].upper() + commit_message[1:]

          message = f"""## Aries {mod_version} for {version_text}

          * { commit_message }

          https://modrinth.com/mod/aries"""
      
         payload = {
           "username": "Aries Bot",
            "content": message
         }
    
         request = urllib.request.Request(
         os.environ["DISCORD_WEBHOOK_URL"],
         data=json.dumps(payload).encode("utf-8"),
         headers={"Content-Type": "application/json" },
         method="POST"
         )
    
         with urllib.request.urlopen(request) as response:
           if response.status >= 300:
             raise RuntimeError(f"Discord webhook failed with status {response.status}")
         PY