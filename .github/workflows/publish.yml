name: Build and Publish to Modrinth

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aries repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Aries
        run: ./gradlew buildAll

      - name: Publish to Modrinth
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Announce release on Discord
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          gradle_properties = Path("gradle.properties").read_text(encoding="utf-8")

          match = re.search(
              r"^mod_version=(.+)$",
              gradle_properties,
              re.MULTILINE
          )

          if not match:
              raise RuntimeError("Could not find mod_version")

          mod_version = match.group(1).strip()

          versions = sorted(
              path.name
              for path in Path("versions").iterdir()
              if path.is_dir()
          )

          if len(versions) == 1:
              version_text = versions[0]
          elif len(versions) == 2:
              version_text = " and ".join(versions)
          else:
              version_text = ", ".join(versions[:-1])
              version_text += " and " + versions[-1]

          commit_message = os.environ.get("COMMIT_MESSAGE", "").strip()

          if commit_message:
              commit_message = commit_message.splitlines()[0].strip()
          else:
              commit_message = "New release"

          commit_message = commit_message[0].upper() + commit_message[1:]
          commit_message = commit_message[:1000]

          message = (
              f"## Aries {mod_version} for {version_text}\n\n"
              f"* {commit_message}\n\n"
              f"https://modrinth.com/mod/aries"
          )

          Path("/tmp/discord.json").write_text(
              json.dumps({
                  "username": "Aries Bot",
                  "content": message
              }),
              encoding="utf-8"
          )
          PY

          curl --fail-with-body \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Aries-GitHub-Actions/1.0" \
            --data-binary @/tmp/discord.json